<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="30분 안에 도착">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf0cb"/><stop offset=".38" stop-color="#e6c574"/>
      <stop offset=".7" stop-color="#bb9136"/><stop offset="1" stop-color="#e9d290"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7e6b0" stop-opacity=".35"/><stop offset="1" stop-color="#f7e6b0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#d9b558" stop-opacity=".18"/><stop offset="1" stop-color="#d9b558" stop-opacity="0"/>
    </radialGradient>
    <mask id="arch">
      <rect width="640" height="300" fill="#fff"/>
      <circle cx="200" cy="232" r="38" fill="#000"/><circle cx="412" cy="232" r="38" fill="#000"/>
    </mask>
  </defs>
  <ellipse cx="320" cy="170" rx="300" ry="130" fill="url(#glow)"/>
  <!-- road -->
  <line x1="20" y1="266" x2="620" y2="266" stroke="#3b2c19" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="280" x2="600" y2="280" stroke="#2a1e12" stroke-width="3" stroke-dasharray="26 18" stroke-linecap="round"/>
  <!-- speed lines -->
  <g stroke="#e6c574" stroke-linecap="round">
    <line x1="44" y1="128" x2="92" y2="128" stroke-width="4" opacity=".45"/>
    <line x1="28" y1="150" x2="104" y2="150" stroke-width="6" opacity=".9"/>
    <line x1="54" y1="172" x2="110" y2="172" stroke-width="5" opacity=".7"/>
    <line x1="20" y1="194" x2="106" y2="194" stroke-width="6" opacity=".8"/>
    <line x1="62" y1="216" x2="110" y2="216" stroke-width="4" opacity=".5"/>
  </g>
  <!-- headlight beam -->
  <polygon points="494,180 590,158 590,212" fill="url(#beam)"/>
  <!-- body -->
  <path mask="url(#arch)" fill="url(#g)" d="M120,228 L120,192 Q122,172 145,167 L220,160 Q262,116 302,111 L372,111 Q404,113 432,157 L472,164 Q492,168 494,188 L494,228 Q494,232 490,232 L124,232 Q120,232 120,228 Z"/>
  <path fill="#0a0706" opacity=".88" d="M234,158 Q266,124 300,121 L326,121 L326,158 Z M338,121 L368,121 Q392,124 416,158 L338,158 Z"/>
  <line x1="332" y1="166" x2="332" y2="222" stroke="#8a6524" stroke-width="2"/>
  <rect x="300" y="176" width="18" height="4" rx="2" fill="#8a6524"/>
  <rect x="364" y="176" width="18" height="4" rx="2" fill="#8a6524"/>
  <ellipse cx="486" cy="182" rx="7" ry="5" fill="#fffaf0"/>
  <rect x="120" y="178" width="7" height="13" rx="2" fill="#b3263e"/>
  <!-- wheels -->
  <g stroke="url(#g)" stroke-width="6" fill="#1d150e">
    <circle cx="200" cy="232" r="29"/><circle cx="412" cy="232" r="29"/>
  </g>
  <circle cx="200" cy="232" r="10" fill="#d9b558"/><circle cx="412" cy="232" r="10" fill="#d9b558"/>
  <!-- stopwatch -->
  <rect x="548" y="28" width="16" height="10" rx="3" fill="#d9b558"/>
  <rect x="553" y="37" width="6" height="9" fill="#9c7529"/>
  <rect x="590" y="44" width="11" height="8" rx="2" fill="#9c7529" transform="rotate(45 595 48)"/>
  <circle cx="556" cy="96" r="46" fill="#150f0a" stroke="#3b2c19" stroke-width="8"/>
  <path d="M556,50 A46,46 0 0 1 556,142" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/>
  <text x="556" y="106" text-anchor="middle" font-family="Pretendard,Arial,sans-serif" font-size="34" font-weight="800" fill="#f7e6b0">30</text>
  <text x="556" y="124" text-anchor="middle" font-family="Pretendard,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#a2917a">MIN</text>
</svg>
