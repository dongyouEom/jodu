# main 브랜치에 커밋될 때마다 build.py 실행 -> dist/ 를 GitHub Pages 로 배포
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # sitemap lastmod 계산에 커밋 이력이 필요
        with:
          fetch-depth: 0
      # Pages가 아직 켜져 있지 않으면 자동으로 켠다 (Settings > Pages 수동 설정 불필요)
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # GIF -> mp4, png/jpg -> webp 자동 변환용 (러너에 보통 설치돼 있음, 없으면 설치)
      - run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: python3 build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
